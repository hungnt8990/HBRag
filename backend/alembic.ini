[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# Giá trị này chỉ là fallback; alembic/env.py luôn override bằng settings.async_database_url (đọc từ .env).
sqlalchemy.url = postgresql+asyncpg://admin_kho_ai:Evncpc%402026%21@10.72.117.227:5432/kho_ai_dung_chung

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
